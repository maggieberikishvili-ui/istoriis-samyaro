<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ისტორიის სამყარო — სასწავლო დაფა</title>

  <!-- საერთო საცავი: ავტორიზაციის შემოწმება + თემის ადრეული ჩატვირთვა -->
  <script src="js/storage.js" data-auth="required"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#58cc02">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ისტორიის სამყარო">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;700;800&family=Noto+Serif+Georgian:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <script src="js/data.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body>
  <!-- ზედა პანელი -->
  <header class="navbar">
    <div class="navbar__inner">
      <a class="navbar__logo" href="dashboard.html">
        <span class="navbar__logo-icon" aria-hidden="true">🏛️</span>
        <span class="navbar__logo-text">ისტორიის სამყარო</span>
      </a>

      <ul class="navbar__stats" aria-label="შენი სტატისტიკა">
        <li class="nav-stat nav-stat--streak" title="უწყვეტი დღეები">
          <span aria-hidden="true">🔥</span>
          <span class="nav-stat__value" id="statStreak">0</span>
          <span class="visually-hidden">უწყვეტი დღე</span>
        </li>
        <li class="nav-stat nav-stat--xp" title="XP ქულები">
          <span aria-hidden="true">⚡</span>
          <span class="nav-stat__value" id="statXp">0</span>
          <span class="visually-hidden">XP</span>
        </li>
        <li class="nav-stat nav-stat--hearts" id="heartsStat" title="სიცოცხლეები">
          <span aria-hidden="true">❤️</span>
          <span class="nav-stat__value" id="statHearts">0</span>
          <span class="visually-hidden">სიცოცხლე</span>
        </li>
        <li class="nav-refill" id="refillItem" hidden>
          <a class="btn btn--danger btn--refill" id="refillBtn" href="lesson.html?mode=practice"
             title="გაიარე 3 კითხვა და აღიდგინე 1 სიცოცხლე">+ ❤️ აღდგენა</a>
        </li>
      </ul>

      <div class="navbar__actions">
        <span class="navbar__user" id="userName" title="მომხმარებელი"></span>
        <button type="button" class="btn btn--outline btn--icon" id="themeToggle" aria-label="თემის შეცვლა">
          <span aria-hidden="true" id="themeIcon">🌙</span>
        </button>
        <button type="button" class="btn btn--outline btn--danger-text" id="logoutBtn">გასვლა</button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <!-- მისალმება -->
    <section class="greeting" aria-labelledby="greetingTitle">
      <h1 class="greeting__title" id="greetingTitle">გამარჯობა!</h1>
      <p class="greeting__text">აირჩიე კურსი და გააგრძელე სწავლა.</p>
    </section>

    <!-- აპლიკაციის დაყენების მინიშნება (PWA) -->
    <section class="install-banner" id="installBanner" aria-labelledby="installTitle" hidden>
      <span class="install-banner__icon" aria-hidden="true">📲</span>
      <div class="install-banner__body">
        <p class="install-banner__title" id="installTitle">დააყენე აპლიკაცია</p>
        <p class="install-banner__text" id="installText"></p>
      </div>
      <div class="install-banner__actions">
        <button type="button" class="btn btn--secondary" id="installBtn" hidden>დაყენება</button>
        <button type="button" class="btn btn--ghost btn--icon" id="installDismiss" aria-label="მინიშნების დახურვა">✕</button>
      </div>
    </section>

    <!-- კურსის არჩევა -->
    <section class="courses" aria-labelledby="coursesTitle">
      <h2 class="section-title" id="coursesTitle">კურსები</h2>
      <div class="course-list" id="courseList" role="tablist" aria-label="კურსის არჩევა"></div>
    </section>

    <!-- გაკვეთილების ბილიკი -->
    <!-- თავები: ყოველ თავს — პერგამენტის ბანერი + გაკვეთილების ბილიკი (რუკის მარშრუტით) -->
    <section class="path-section" id="pathSection" role="tabpanel">
      <div class="chapter-list" id="chapterList"></div>
      <p class="path-note">ახალი თავები მალე დაემატება 📜</p>
    </section>
  </main>

  <!-- შეტყობინება (toast) -->
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
