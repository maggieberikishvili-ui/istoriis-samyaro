<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ისტორიის გაკვეთილი: მოკლე თეორია და სავარჯიშოები.">
  <title>ისტორიის სამყარო — გაკვეთილი</title>
  <!-- პირადი გვერდი (შესვლის შემდეგ) — საძიებოში არ ჩანს -->
  <meta name="robots" content="noindex">

  <!-- საერთო საცავი: ავტორიზაციის შემოწმება + თემის ადრეული ჩატვირთვა -->
  <script src="js/storage.js" data-auth="required"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e6f5e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ისტორიის სამყარო">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;700;800&family=Noto+Serif+Georgian:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/lesson.css">

  <script src="js/utils.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/audio-manifest.js" defer></script>
  <script src="js/lesson.js" defer></script>
</head>
<body>
  <div class="lesson-app">
    <!-- ზედა პანელი -->
    <header class="lesson-top">
      <a class="lesson-top__close" href="dashboard.html" aria-label="გაკვეთილის დახურვა და დაფაზე დაბრუნება">✕</a>

      <div class="lesson-progress" role="progressbar" id="progressBar"
           aria-label="გაკვეთილის პროგრესი" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="lesson-progress__fill" id="progressFill"></div>
      </div>

      <div class="lesson-hearts" id="heartsBox" title="დარჩენილი სიცოცხლეები">
        <span aria-hidden="true">❤️</span>
        <span id="heartsCount">5</span>
        <span class="visually-hidden">სიცოცხლე</span>
      </div>
    </header>

    <!-- სავარჯიშოს არე -->
    <main class="lesson-stage" id="stage" aria-live="polite"></main>

    <!-- ქვედა პანელი: ღილაკი + უკუკავშირი -->
    <footer class="lesson-footer" id="footer" data-state="idle">
      <div class="lesson-footer__inner">
        <div class="feedback" id="feedback" role="status" hidden>
          <span class="feedback__icon" id="feedbackIcon" aria-hidden="true"></span>
          <div class="feedback__body">
            <p class="feedback__title" id="feedbackTitle"></p>
            <p class="feedback__text" id="feedbackText"></p>
          </div>
        </div>
        <button type="button" class="btn lesson-footer__btn" id="primaryBtn" disabled>შემოწმება</button>
      </div>
    </footer>

    <!-- გამარჯვების ეკრანი -->
    <section class="result" id="victoryScreen" aria-labelledby="victoryTitle" hidden>
      <div class="result__emblem result__emblem--win" id="victoryEmblem" aria-hidden="true">🏆</div>
      <h2 class="result__title" id="victoryTitle">გაკვეთილი დასრულდა!</h2>
      <p class="result__subtitle" id="victorySubtitle"></p>
      <div class="result__stats">
        <div class="result-stat result-stat--xp">
          <span class="result-stat__label">მიღებული XP</span>
          <span class="result-stat__value" id="victoryXp"></span>
        </div>
        <div class="result-stat result-stat--accuracy">
          <span class="result-stat__label">სიზუსტე</span>
          <span class="result-stat__value" id="victoryAccuracy"></span>
        </div>
        <div class="result-stat result-stat--hearts" id="victoryHeartsStat" hidden>
          <span class="result-stat__label">სიცოცხლე</span>
          <span class="result-stat__value" id="victoryHearts"></span>
        </div>
      </div>
      <a class="btn btn--block result__btn" href="dashboard.html">დაფაზე დაბრუნება</a>
    </section>

    <!-- სიცოცხლეები ამოიწურა -->
    <section class="result" id="gameOverScreen" aria-labelledby="gameOverTitle" hidden>
      <div class="result__emblem result__emblem--lose" aria-hidden="true">💔</div>
      <h2 class="result__title" id="gameOverTitle">სიცოცხლეები ამოიწურა — სცადე თავიდან!</h2>
      <p class="result__subtitle">დაფაზე გაიარე „❤️ აღდგენის“ სავარჯიშო ან დაბრუნდი ხვალ — ახალ დღეს სიცოცხლეები 5-მდე შეივსება. რამდენიმე წამში ავტომატურად გადახვალ დაფაზე.</p>
      <a class="btn btn--danger btn--block result__btn" href="dashboard.html">დაფაზე დაბრუნება</a>
    </section>
  </div>
</body>
</html>
