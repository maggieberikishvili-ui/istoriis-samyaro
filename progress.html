<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="სწავლის კვირის შეჯამება მშობლისთვის: აქტიური დღეები, XP, გავლილი გაკვეთილები და გასამეორებელი თემები.">
  <title>ჩემი პროგრესი — Edubba</title>
  <!-- პირადი გვერდი (შესვლის შემდეგ) — საძიებოში არ ჩანს -->
  <meta name="robots" content="noindex">

  <!-- საერთო საცავი: ავტორიზაციის შემოწმება + თემის ადრეული ჩატვირთვა -->
  <script src="js/storage.js" data-auth="required"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2e6f5e">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Edubba">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;700;800&family=Noto+Serif+Georgian:wght@700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/progress.css">

  <script src="js/icons.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/data.js" defer></script>
  <script src="js/progress.js" defer></script>
</head>
<body>
  <header class="progress-top">
    <a class="btn btn--outline progress-top__back" href="dashboard.html">← დაფაზე</a>
    <button type="button" class="theme-switch" id="themeToggle" role="switch" aria-checked="false" aria-label="ღამის რეჟიმი">
      <svg class="ims-icon theme-switch__day" aria-hidden="true" focusable="false"><use href="#ic-day"></use></svg>
      <svg class="ims-icon theme-switch__night" aria-hidden="true" focusable="false"><use href="#ic-night"></use></svg>
    </button>
  </header>

  <main class="progress-page">
    <section class="progress-hero">
      <p class="progress-hero__eyebrow">📊 სწავლის შეჯამება</p>
      <h1 class="progress-hero__title" id="reportTitle">ჩემი პროგრესი</h1>
      <p class="progress-hero__period" id="reportPeriod"></p>
    </section>

    <!-- ბოლო 7 დღე: ციფრები -->
    <section class="card progress-card" aria-labelledby="weekTitle">
      <h2 class="progress-card__title" id="weekTitle">ბოლო 7 დღე</h2>
      <ul class="progress-stats" id="weekStats"></ul>
      <div class="week-chart" id="weekChart" role="img"></div>
    </section>

    <!-- კურსები -->
    <section class="card progress-card" aria-labelledby="coursesTitle">
      <h2 class="progress-card__title" id="coursesTitle">გავლილი მასალა</h2>
      <ul class="progress-courses" id="courseRows"></ul>
    </section>

    <!-- გასამეორებელი თემები -->
    <section class="card progress-card" aria-labelledby="weakTitle">
      <h2 class="progress-card__title" id="weakTitle">გასამეორებელი თემები</h2>
      <p class="progress-card__hint">გაკვეთილები, სადაც ბოლო დროს ყველაზე მეტი შეცდომა იყო.</p>
      <ul class="progress-weak" id="weakList"></ul>
    </section>

    <div class="progress-actions">
      <button type="button" class="btn btn--block" id="shareBtn">📤 გაუზიარე მშობელს</button>
      <p class="progress-actions__status" id="shareStatus" role="status" aria-live="polite"></p>
      <textarea class="input progress-actions__text" id="shareText" rows="7" readonly hidden
                aria-label="შეჯამების ტექსტი კოპირებისთვის"></textarea>
    </div>

    <p class="progress-note">მონაცემები ინახება ამ მოწყობილობაზე. დღიური სტატისტიკა აღირიცხება ამ გვერდის დამატების დღიდან.</p>
  </main>
</body>
</html>
