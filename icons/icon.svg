  <!-- სტილიზებული ტაძარი — ბრტყელი, ქაღალდისფერი; 0.9 მასშტაბით უსაფრთხო ზონაში -->
  <g transform="translate(256 256) scale(0.9) translate(-256 -268)" fill="#f7f3ea">
    <path d="M256 128 L398 200 Q402 206 396 210 L116 210 Q110 206 114 200 Z"/>
    <rect x="132" y="220" width="248" height="24" rx="5"/>
    <rect x="148" y="254" width="36" height="94" rx="5"/>
    <rect x="208" y="254" width="36" height="94" rx="5"/>
    <rect x="268" y="254" width="36" height="94" rx="5"/>
    <rect x="328" y="254" width="36" height="94" rx="5"/>
    <rect x="126" y="356" width="260" height="22" rx="5"/>
    <rect x="106" y="384" width="300" height="24" rx="6"/>
  </g>
  <!-- ტერაკოტას აქცენტი ფრონტონზე -->
  <g transform="translate(256 256) scale(0.9) translate(-256 -268)">
    <circle cx="256" cy="180" r="11" fill="#b85d3b"/>
  </g>
</svg>
