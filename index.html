<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ისტორიის სამყარო — ისწავლე ისტორია თამაშით, ყოველდღე რამდენიმე წუთში.">
  <title>ისტორიის სამყარო — შესვლა</title>

  <!-- საერთო საცავი: თემის ადრეული ჩატვირთვა + შესული მომხმარებლის გადამისამართება -->
  <script src="js/storage.js" data-auth="guest-only"></script>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#58cc02">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ისტორიის სამყარო">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">

  <script src="js/auth.js" defer></script>
</head>
<body>
  <div class="auth-page">
    <header class="auth-header">
      <button type="button" class="btn btn--outline" id="installBtn" hidden>📲 დაყენება</button>
      <button type="button" class="btn btn--outline btn--icon" id="themeToggle" aria-label="თემის შეცვლა">
        <span aria-hidden="true" id="themeIcon">🌙</span>
      </button>
    </header>

    <main class="auth-main">
      <!-- მისალმება -->
      <section class="hero" aria-labelledby="appTitle">
        <div class="hero__emblem" aria-hidden="true">🏛️</div>
        <h1 class="logo" id="appTitle">ისტორიის სამყარო</h1>
        <p class="hero__text">
          ისტორია მარტივად და საინტერესოდ — ყოველდღიური გამოწვევები, ქულები და ეტაპობრივი წინსვლა. ძველი სამყაროდან თანამედროვეობამდე.</p>
        <ul class="hero__stats" aria-label="რას მიიღებ">
          <li class="stat-chip stat-chip--xp"><span aria-hidden="true">⚡</span> XP ქულები</li>
          <li class="stat-chip stat-chip--streak"><span aria-hidden="true">🔥</span>უწყვეტი დღეები</li>
          <li class="stat-chip stat-chip--hearts"><span aria-hidden="true">❤️</span> 5 სიცოცხლე</li>
        </ul>
      </section>

      <!-- ავტორიზაცია -->
      <section class="card auth-card" aria-label="ავტორიზაცია">
        <div class="tabs" role="tablist" aria-label="ავტორიზაციის რეჟიმი">
          <button type="button" class="tab" role="tab" id="tabLogin"
                  aria-selected="true" aria-controls="authForm" data-mode="login">შესვლა</button>
          <button type="button" class="tab" role="tab" id="tabRegister"
                  aria-selected="false" aria-controls="authForm" data-mode="register">რეგისტრაცია</button>
        </div>

        <form class="auth-form" id="authForm" role="tabpanel" aria-labelledby="tabLogin" novalidate>
          <h2 class="auth-form__title" id="formTitle">კეთილი იყოს შენი დაბრუნება!</h2>

          <div class="alert alert--error" id="formMessage" role="alert" hidden></div>

          <div class="field" id="nameField" hidden>
            <label class="field__label" for="name">სახელი</label>
            <input class="input" type="text" id="name" name="name"
                   autocomplete="name" maxlength="30" placeholder="მაგ.: ნინო">
          </div>

          <div class="field">
            <label class="field__label" for="email">ელ-ფოსტა</label>
            <input class="input" type="email" id="email" name="email"
                   autocomplete="email" maxlength="100" placeholder="you@example.com" required>
          </div>

          <div class="field">
            <label class="field__label" for="password">პაროლი</label>
            <div class="password-wrap">
              <input class="input" type="password" id="password" name="password"
                     autocomplete="current-password" minlength="6" maxlength="64"
                     placeholder="მინიმუმ 6 სიმბოლო" required>
              <button type="button" class="password-toggle" id="passwordToggle"
                      aria-label="პაროლის ჩვენება" aria-pressed="false">👁️</button>
            </div>
            <span class="field__hint" id="passwordHint" hidden>მინიმუმ 6 სიმბოლო</span>
          </div>

          <button type="submit" class="btn btn--block" id="submitBtn">შესვლა</button>
        </form>

        <div class="divider">ან</div>

        <button type="button" class="btn btn--outline btn--block" id="guestBtn">
          გაგრძელება სტუმრის სტატუსით
        </button>

        <p class="auth-footer">
          შენი პროგრესი ავტომატურად შეინახება.
        </p>
      </section>
    </main>
  </div>
</body>
</html>
