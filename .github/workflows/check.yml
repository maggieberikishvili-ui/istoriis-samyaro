# შემოწმება + ტესტები + გამოქვეყნება GitHub Pages-ზე.
# ყოველ push-ზე main-ში ეშვება tools/check.js და ბრაუზერის ტესტები (tests/);
# საიტი ქვეყნდება მხოლოდ მაშინ, თუ ორივე გავიდა. (Settings → Pages → Source: "GitHub Actions".)
name: check-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: პროექტის შემოწმება
        run: node tools/check.js

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ბრაუზერის ტესტები (Playwright — დეტალები tests/run.sh-ში)
        run: bash tests/run.sh

  deploy:
    needs: [check, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - name: საიტის შეფუთვა (tools/ გამოქვეყნებას არ სჭირდება)
        run: |
          mkdir -p _site
          rsync -a --exclude '/.git' --exclude '/.github' --exclude '/.claude' \
            --exclude '/tools' --exclude '/tests' --exclude '/brand' --exclude '/_site' ./ _site/
      - name: ვერსიის ჰეში sw.js-ში (ნებისმიერი ცვლილება მომხმარებელთან მივა)
        run: |
          H=$(cd _site && find . -type f ! -name sw.js ! -path './assets/audio/*' -print0 | sort -z | xargs -0 sha1sum | sha1sum | cut -c1-10)
          sed -i -E "s/const VERSION = \"(v[0-9]+)\";/const VERSION = \"\1-$H\";/" _site/sw.js
          grep -E "const VERSION = \"v[0-9]+-$H\";" _site/sw.js
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
